<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python Scratchpad</title>
</head>

<body>

  <header>
    <div class="flex flex-row">
      <img src="/favicon.svg" alt="logo" width="24" height="24" />
      <h1 id="title">Python Scratchpad</h1>
    </div>

    <section id="actions-toolbar">
      <button id="share-button" title="Copy link to clipboard">
        <i data-lucide="link-2"></i>
        Share
      </button>
      <button id="clear-output" title="Clear output">
        <i data-lucide="trash-2"></i>
        Clear
      </button>
      <button id="run-button" class="primary" title="Run (Mod+Enter)">
        <i data-lucide="play"></i>
        <i data-lucide="square"></i>
        <span id="run-label">Run</span>
      </button>
    </section>
  </header>

  <main>

    <section id="code">
      <button id="copy-code" class="panel-action" title="Copy code" aria-label="Copy code">
        <i data-lucide="copy"></i>
        <i data-lucide="check"></i>
      </button>
      <div id="source-code"></div>
    </section>

    <div id="divider" role="separator"></div>

    <section id="output">
      <button id="copy-output" class="panel-action" title="Copy output" aria-label="Copy output">
        <i data-lucide="copy"></i>
        <i data-lucide="check"></i>
      </button>
      <div id="display-output" role="log" aria-live="polite"></div>
    </section>

  </main>

  <footer>
    <div class="flex flex-row">
      <button id="about-button" popovertarget="about-popover" title="About this project">
        <i data-lucide="info"></i>
        Info
      </button>
    </div>


    <div class="flex flex-row" style="gap: 1.5rem;">
      <button id="toggle-layout" title="Toggle Layout">
        <i class="layout-vertical" data-lucide="panel-right"></i>
        <i class="layout-horizontal" data-lucide="panel-bottom"></i>
        Switch Layout
      </button>
      <div class="flex flex-row" style="gap: 0.375rem; align-items: center;">
        <label for="theme-select" style="display: flex; align-items: center; gap: 0.25rem;"><i
            data-lucide="palette"></i> Theme:</label>
        <select id="theme-select" title="Theme" aria-label="Editor Theme"></select>
      </div>
    </div>
  </footer>

  <div id="about-popover" popover>
    <div class="popover-content">
      <h2>Python Scratchpad</h2>
      <p>For when you need to do something quick in Python.</p>
      <p>Uses <a href="https://micropython.org/" target="_blank" rel="noopener">MicroPython</a> (WebAssembly) to run
        Python directly in the browser. No installation required.</p>
      <p class="muted">State is lost on page reload. This is a scratchpad, not an IDE.</p>
      <p class="muted">Source code on <a href="https://github.com/Shresht7/python-scratchpad" target="_blank"
          rel="noopener">GitHub</a> · MIT License</p>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
