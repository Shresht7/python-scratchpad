<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python Scratchpad</title>
</head>

<body>

  <header>
    <h1 id="title">Python Scratchpad</h1>
    <section id="actions-toolbar">
      <button id="run-button" class="primary" title="Run (Mod+Enter)">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#play"></use></svg>
        Run
      </button>
    </section>
  </header>

  <main>

    <section id="code">
      <div id="source-code"></div>
    </section>

    <section id="output">
      <div id="display-output"></div>
    </section>

  </main>

  <footer>
    <div>
      <button id="toggle-layout" title="Toggle Layout">
        <svg class="icon" aria-hidden="true"><use href="/icons.svg#split-vertical"></use></svg>
        Toggle Layout
      </button>
    </div>

    <div>
      <label for="theme-select">Theme:</label>
      <select id="theme-select" title="Theme" aria-label="Editor Theme"></select>
    </div>
  </footer>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
